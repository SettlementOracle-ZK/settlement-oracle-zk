[package]
name = "settlement-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
description = "SettlementOracle ZK API gateway (Rust + PostgreSQL)"
default-run = "settlement-api"

[workspace]

[dependencies]
escrow = { path = "../programs/escrow", default-features = false, features = ["no-entrypoint"] }
anchor-lang = "1.1.2"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "migrate", "chrono", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
